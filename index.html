<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח בנייה — מרעיון לפרויקט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Assistant:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#F5F6FA;
    --surface:#FFFFFF;
    --ink:#14213D;
    --ink-soft:#5B6478;
    --line:#E3E6EF;
    --line-strong:#CBD0E1;
    --teal:#0EA894;
    --teal-bg:#E3F7F3;
    --amber:#F5A524;
    --amber-bg:#FEF3DE;
    --green:#2F9E67;
    --green-bg:#E4F6EC;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,33,61,.04), 0 8px 24px -12px rgba(20,33,61,.12);
    --font-display:'Rubik', 'Assistant', sans-serif;
    --font-body:'Assistant', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
  }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  /* ===== Header ===== */
  header.top{
    position:sticky; top:0; z-index:40;
    background:rgba(245,246,250,.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:1120px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:1.1rem; }
  .brand-mark{
    width:30px; height:30px; border-radius:8px;
    background:var(--ink); position:relative; flex:none;
  }
  .brand-mark::before, .brand-mark::after{
    content:''; position:absolute; background:var(--teal); border-radius:1px;
  }
  .brand-mark::before{ width:12px; height:2px; top:9px; right:9px; }
  .brand-mark::after{ width:2px; height:12px; top:9px; right:9px; }

  .auth-area{ display:flex; align-items:center; gap:12px; }
  .user-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:5px 6px 5px 14px; font-size:.88rem;
  }
  .user-chip img{ width:26px; height:26px; border-radius:50%; }
  .btn-logout{
    background:none; border:none; color:var(--ink-soft); font-size:.82rem;
    text-decoration:underline; padding:0;
  }

  /* ===== Hero ===== */
  .hero{
    max-width:1120px; margin:0 auto; padding:56px 24px 40px;
    display:grid; grid-template-columns:1.1fr .9fr; gap:32px; align-items:center;
  }
  @media (max-width:820px){ .hero{ grid-template-columns:1fr; padding-top:36px; } }
  .eyebrow{
    font-family:var(--font-mono); font-size:.72rem; letter-spacing:.06em;
    color:var(--teal); text-transform:uppercase; margin:0 0 10px;
  }
  h1{
    font-family:var(--font-display); font-weight:800; font-size:2.6rem;
    line-height:1.12; margin:0 0 16px; letter-spacing:-.01em;
  }
  @media (max-width:560px){ h1{ font-size:2rem; } }
  .hero p{ color:var(--ink-soft); font-size:1.05rem; max-width:46ch; margin:0 0 24px; }
  .hero-actions{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .btn-primary{
    background:var(--ink); color:#fff; border:none; border-radius:10px;
    padding:13px 22px; font-size:.98rem; font-weight:600; font-family:var(--font-body);
    transition:transform .15s ease, background .15s ease;
  }
  .btn-primary:hover{ background:#20305a; transform:translateY(-1px); }
  .btn-primary:disabled{ background:var(--line-strong); color:#8b91a3; cursor:not-allowed; transform:none; }
  .hint-text{ font-size:.85rem; color:var(--ink-soft); }

  /* blueprint panel */
  .blueprint{
    background:var(--ink); border-radius:20px; aspect-ratio:4/3; position:relative;
    overflow:hidden;
    background-image:
      linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size:28px 28px;
  }
  .blueprint::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 30% 25%, rgba(14,168,148,.35), transparent 55%);
  }
  .blueprint .tag{
    position:absolute; font-family:var(--font-mono); font-size:.72rem; color:#fff;
    border:1px dashed rgba(255,255,255,.5); border-radius:8px; padding:6px 10px;
    background:rgba(255,255,255,.06);
  }
  .blueprint .tag.t1{ top:14%; right:10%; }
  .blueprint .tag.t2{ bottom:20%; left:12%; transform:rotate(-3deg); }
  .blueprint .tag.t3{ top:48%; right:38%; transform:rotate(2deg); }
  .blueprint .stamp{
    position:absolute; bottom:9%; right:8%;
    font-family:var(--font-display); font-weight:700; font-size:.95rem; color:var(--teal);
    border:2px solid var(--teal); border-radius:10px; padding:8px 14px;
    transform:rotate(-6deg); letter-spacing:.02em;
  }

  /* ===== Filters ===== */
  .filters{
    max-width:1120px; margin:0 auto; padding:0 24px 20px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
  }
  .status-tabs{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px; }
  .status-tabs button{
    border:none; background:none; padding:7px 14px; border-radius:999px; font-size:.86rem;
    color:var(--ink-soft); font-weight:600; transition:background .15s ease, color .15s ease;
  }
  .status-tabs button.active{ background:var(--ink); color:#fff; }
  .filter-right{ display:flex; gap:10px; flex-wrap:wrap; }
  select, input[type=text]{
    font-family:inherit; border:1px solid var(--line); background:var(--surface);
    border-radius:10px; padding:9px 12px; font-size:.88rem; color:var(--ink);
  }

  /* ===== Board ===== */
  .board{ max-width:1120px; margin:0 auto; padding:0 24px 80px; }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 18px 16px; position:relative; box-shadow:var(--shadow);
    border-inline-start:4px solid var(--line-strong);
    display:flex; flex-direction:column; gap:10px;
    animation:rise .35s ease both;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  .card.status-open{ border-inline-start-color:var(--teal); }
  .card.status-progress{ border-inline-start-color:var(--amber); }
  .card.status-done{ border-inline-start-color:var(--green); }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .type-tag{
    font-family:var(--font-mono); font-size:.68rem; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:6px; padding:3px 7px; white-space:nowrap;
  }
  .stamp-badge{
    font-family:var(--font-display); font-weight:700; font-size:.66rem; letter-spacing:.03em;
    border-radius:8px; padding:4px 9px; transform:rotate(-4deg); white-space:nowrap;
  }
  .status-open .stamp-badge{ color:var(--teal); border:1.5px dashed var(--teal); background:var(--teal-bg); }
  .status-progress .stamp-badge{ color:#9a6b0c; border:1.5px dashed var(--amber); background:var(--amber-bg); }
  .status-done .stamp-badge{ color:var(--green); border:1.5px dashed var(--green); background:var(--green-bg); }

  .card h3{ font-family:var(--font-display); font-size:1.08rem; margin:0; line-height:1.3; }
  .card p.desc{ color:var(--ink-soft); font-size:.9rem; margin:0; flex:1; }
  .card .meta{ font-size:.78rem; color:var(--ink-soft); display:flex; flex-direction:column; gap:2px; }
  .card .notes{
    font-size:.82rem; background:var(--bg); border-radius:8px; padding:8px 10px; color:var(--ink);
  }
  .card-actions{ display:flex; gap:8px; margin-top:4px; }
  .btn-sm{
    border-radius:8px; padding:8px 12px; font-size:.82rem; font-weight:600; border:1px solid transparent; flex:1;
  }
  .btn-claim{ background:var(--ink); color:#fff; }
  .btn-claim:hover{ background:#20305a; }
  .btn-outline{ background:none; border:1px solid var(--line-strong); color:var(--ink); }
  .btn-outline:hover{ background:var(--bg); }

  .empty{
    text-align:center; padding:70px 20px; color:var(--ink-soft);
    border:1px dashed var(--line-strong); border-radius:var(--radius); background:var(--surface);
  }
  .empty strong{ display:block; color:var(--ink); font-family:var(--font-display); font-size:1.1rem; margin-bottom:6px; }
  .loading{ text-align:center; padding:60px 0; color:var(--ink-soft); font-family:var(--font-mono); font-size:.85rem; }

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(20,33,61,.45);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .overlay[hidden]{ display:none; }
  .modal{
    background:var(--surface); border-radius:16px; padding:26px; width:100%; max-width:440px;
    box-shadow:0 20px 60px -20px rgba(20,33,61,.4);
    animation:pop .18s ease both;
  }
  @keyframes pop{ from{ opacity:0; transform:scale(.97);} to{ opacity:1; transform:scale(1);} }
  .modal h2{ font-family:var(--font-display); font-size:1.25rem; margin:0 0 16px; }
  .field{ margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:.82rem; font-weight:600; color:var(--ink-soft); }
  .field input, .field textarea, .field select{
    font-family:inherit; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:.92rem; width:100%;
  }
  .field textarea{ min-height:80px; resize:vertical; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn-ghost{ background:none; border:1px solid var(--line-strong); border-radius:10px; padding:11px 16px; font-weight:600; flex:1; }

  /* ===== Toast ===== */
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff;
    padding:12px 18px; border-radius:10px; font-size:.88rem; box-shadow:var(--shadow);
    z-index:200; animation:pop .18s ease both;
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="brand-mark"></span> לוח בנייה</div>
    <div class="auth-area" id="authArea">
      <div id="gsiButton"></div>
    </div>
  </div>
</header>

<section class="hero">
  <div>
    <p class="eyebrow">// לוח פרויקטים קהילתי</p>
    <h1>מהרעיון שלך<br>לפרויקט חי</h1>
    <p>מפרסמים רעיון לאתר, אפליקציה או תוכנת מחשב — ומישהו אחר לוקח אותו על עצמו ומעדכן איך זה מתקדם. בלי ניירת, רק שיתוף פעולה.</p>
    <div class="hero-actions">
      <button class="btn-primary" id="openCreateBtn" disabled>פרסמו רעיון חדש</button>
      <span class="hint-text" id="loginHint">התחברו עם גוגל כדי לפרסם או לקחת פרויקט</span>
    </div>
  </div>
  <div class="blueprint" aria-hidden="true">
    <span class="tag t1">אתר</span>
    <span class="tag t2">אפליקציה</span>
    <span class="tag t3">תוכנה</span>
    <span class="stamp">בבנייה</span>
  </div>
</section>

<div class="filters">
  <div class="status-tabs" id="statusTabs">
    <button data-status="all" class="active">הכל</button>
    <button data-status="Open">פתוח</button>
    <button data-status="In Progress">בבנייה</button>
    <button data-status="Done">הושלם</button>
  </div>
  <div class="filter-right">
    <select id="typeFilter">
      <option value="all">כל הסוגים</option>
      <option value="אתר">אתר</option>
      <option value="אפליקציה">אפליקציה</option>
      <option value="תוכנת מחשב">תוכנת מחשב</option>
    </select>
    <input type="text" id="searchInput" placeholder="חיפוש חופשי…">
  </div>
</div>

<main class="board">
  <div id="boardContent" class="loading">טוען פרויקטים…</div>
</main>

<!-- Create modal -->
<div class="overlay" id="createOverlay" hidden>
  <div class="modal">
    <h2>פרויקט חדש</h2>
    <form id="createForm">
      <div class="field">
        <label for="cTitle">שם הפרויקט</label>
        <input type="text" id="cTitle" required maxlength="80">
      </div>
      <div class="field">
        <label for="cType">סוג</label>
        <select id="cType">
          <option value="אתר">אתר</option>
          <option value="אפליקציה">אפליקציה</option>
          <option value="תוכנת מחשב">תוכנת מחשב</option>
        </select>
      </div>
      <div class="field">
        <label for="cDesc">מה בדיוק רוצים שיקרה?</label>
        <textarea id="cDesc" required maxlength="600" placeholder="תארו את הרעיון, מה הוא פותר, ולמי הוא מיועד"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-close="createOverlay">ביטול</button>
        <button type="submit" class="btn-primary" style="flex:1">פרסום</button>
      </div>
    </form>
  </div>
</div>

<!-- Update modal -->
<div class="overlay" id="updateOverlay" hidden>
  <div class="modal">
    <h2>עדכון התקדמות</h2>
    <form id="updateForm">
      <input type="hidden" id="uProjectId">
      <div class="field">
        <label for="uStatus">סטטוס</label>
        <select id="uStatus">
          <option value="In Progress">בבנייה</option>
          <option value="Done">הושלם</option>
        </select>
      </div>
      <div class="field">
        <label for="uNotes">מה קרה עד עכשיו?</label>
        <textarea id="uNotes" maxlength="600" placeholder="עדכון קצר על ההתקדמות"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-close="updateOverlay">ביטול</button>
        <button type="submit" class="btn-primary" style="flex:1">שמירה</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ============ הגדרות צד לקוח בלבד ============ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby1aW_Hi1suSVQmBfU9sp9jQ80xXiFSImLBnLhElP4LmUjF7mOhi0HizeOnz63GCEXg/exec';
const GOOGLE_CLIENT_ID = '176938351727-t5cgglugm7cgf2j5b2g512jn2ol5agic.apps.googleusercontent.com';

/* ============ מצב ============ */
let currentUser = null; // {email, name, picture}
let allProjects = [];
let statusFilter = 'all';
let typeFilter = 'all';
let searchTerm = '';

const STATUS_LABEL = { 'Open':'פתוח', 'In Progress':'בבנייה', 'Done':'הושלם' };
const STATUS_CLASS = { 'Open':'status-open', 'In Progress':'status-progress', 'Done':'status-done' };

/* ============ Google Sign-In ============ */
function decodeJwt(token){
  const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  const json = decodeURIComponent(atob(base64).split('').map(c =>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(json);
}

function handleCredentialResponse(response){
  const payload = decodeJwt(response.credential);
  currentUser = { email: payload.email, name: payload.name, picture: payload.picture };
  renderAuthArea();
  renderBoard();
}

function renderAuthArea(){
  const openBtn = document.getElementById('openCreateBtn');
  const hint = document.getElementById('loginHint');
  const area = document.getElementById('authArea');

  if (currentUser){
    openBtn.disabled = false;
    hint.style.display = 'none';
    area.innerHTML = `
      <div class="user-chip">
        <img src="${currentUser.picture}" alt="">
        <span>${escapeHtml(currentUser.name)}</span>
        <button class="btn-logout" id="logoutBtn">יציאה</button>
      </div>`;
    document.getElementById('logoutBtn').addEventListener('click', logout);
  } else {
    openBtn.disabled = true;
    hint.style.display = '';
    area.innerHTML = `<div id="gsiButton"></div>`;
    renderGsiButton();
  }
}

function logout(){
  currentUser = null;
  google.accounts.id.disableAutoSelect();
  renderAuthArea();
  renderBoard();
}

function renderGsiButton(){
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById('gsiButton'),
    { theme:'outline', size:'medium', shape:'pill', text:'signin', locale:'iw' }
  );
}

window.addEventListener('load', () => {
  renderGsiButton();
  loadProjects();
});

/* ============ API ============ */
async function apiGet(action){
  const res = await fetch(`${SCRIPT_URL}?action=${encodeURIComponent(action)}`);
  return res.json();
}
async function apiPost(action, payload){
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action, email: currentUser.email, name: currentUser.name, ...payload })
  });
  return res.json();
}

async function loadProjects(){
  const board = document.getElementById('boardContent');
  board.className = 'loading';
  board.textContent = 'טוען פרויקטים…';
  try{
    const data = await apiGet('list');
    if (!data.ok) throw new Error(data.error || 'שגיאה');
    allProjects = data.projects.sort((a,b) => new Date(b.CreatedAt) - new Date(a.CreatedAt));
    renderBoard();
  } catch(err){
    board.className = 'empty';
    board.innerHTML = `<strong>לא הצלחנו לטעון את הלוח</strong>יש לוודא שהסקריפט פרוס כ"Anyone can access".<br><button class="btn-outline btn-sm" style="margin-top:12px" onclick="loadProjects()">נסו שוב</button>`;
  }
}

/* ============ רינדור ============ */
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function renderBoard(){
  const board = document.getElementById('boardContent');
  let list = allProjects.filter(p => {
    if (statusFilter !== 'all' && p.Status !== statusFilter) return false;
    if (typeFilter !== 'all' && p.Type !== typeFilter) return false;
    if (searchTerm && !(p.Title + p.Description).toLowerCase().includes(searchTerm.toLowerCase())) return false;
    return true;
  });

  if (list.length === 0){
    board.className = 'empty';
    board.innerHTML = `<strong>אין עדיין פרויקטים כאלה</strong>זה מקום טוב להיות הראשונים לפרסם רעיון.`;
    return;
  }

  board.className = 'grid';
  board.innerHTML = list.map(cardHtml).join('');

  list.forEach(p => {
    const claimBtn = document.getElementById('claim-' + p.ID);
    if (claimBtn) claimBtn.addEventListener('click', () => claimProject(p.ID));
    const unclaimBtn = document.getElementById('unclaim-' + p.ID);
    if (unclaimBtn) unclaimBtn.addEventListener('click', () => unclaimProject(p.ID));
    const updateBtn = document.getElementById('update-' + p.ID);
    if (updateBtn) updateBtn.addEventListener('click', () => openUpdateModal(p));
  });
}

function cardHtml(p){
  const statusClass = STATUS_CLASS[p.Status] || 'status-open';
  const isMine = currentUser && p.ClaimedByEmail === currentUser.email;
  const isOpen = p.Status === 'Open';

  let actions = '';
  if (isOpen){
    actions = `<button class="btn-sm btn-claim" id="claim-${p.ID}">לקחת על עצמי</button>`;
  } else if (isMine){
    actions = `
      <button class="btn-sm btn-claim" id="update-${p.ID}">עדכון התקדמות</button>
      <button class="btn-sm btn-outline" id="unclaim-${p.ID}">לשחרר</button>`;
  }

  return `
    <article class="card ${statusClass}">
      <div class="card-top">
        <span class="type-tag">${escapeHtml(p.Type)}</span>
        <span class="stamp-badge">${STATUS_LABEL[p.Status] || p.Status}</span>
      </div>
      <h3>${escapeHtml(p.Title)}</h3>
      <p class="desc">${escapeHtml(p.Description)}</p>
      ${p.ProgressNotes ? `<div class="notes">${escapeHtml(p.ProgressNotes)}</div>` : ''}
      <div class="meta">
        <span>פורסם ע"י ${escapeHtml(p.CreatorName)}</span>
        ${p.ClaimedByName ? `<span>מבוצע ע"י ${escapeHtml(p.ClaimedByName)}</span>` : ''}
      </div>
      ${actions ? `<div class="card-actions">${actions}</div>` : ''}
    </article>`;
}

/* ============ פילטרים ============ */
document.getElementById('statusTabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#statusTabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  statusFilter = btn.dataset.status;
  renderBoard();
});
document.getElementById('typeFilter').addEventListener('change', e => { typeFilter = e.target.value; renderBoard(); });
document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value; renderBoard(); });

/* ============ יצירת פרויקט ============ */
document.getElementById('openCreateBtn').addEventListener('click', () => {
  if (!currentUser) return;
  document.getElementById('createOverlay').hidden = false;
});
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => { document.getElementById(btn.dataset.close).hidden = true; });
});
document.getElementById('createForm').addEventListener('submit', async e => {
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type=submit]');
  submitBtn.disabled = true; submitBtn.textContent = 'מפרסם…';
  try{
    const data = await apiPost('create', {
      title: document.getElementById('cTitle').value.trim(),
      type: document.getElementById('cType').value,
      description: document.getElementById('cDesc').value.trim()
    });
    if (!data.ok) throw new Error(data.error);
    document.getElementById('createOverlay').hidden = true;
    e.target.reset();
    showToast('הרעיון פורסם!');
    await loadProjects();
  } catch(err){
    showToast('משהו השתבש, נסו שוב');
  } finally {
    submitBtn.disabled = false; submitBtn.textContent = 'פרסום';
  }
});

/* ============ לקיחה / שחרור / עדכון ============ */
async function claimProject(id){
  if (!currentUser) return;
  try{
    const data = await apiPost('claim', { projectId: id });
    if (!data.ok) throw new Error(data.error);
    showToast('הפרויקט אצלכם — בהצלחה בבנייה!');
    await loadProjects();
  } catch(err){ showToast('לא ניתן לקחת את הפרויקט כרגע'); }
}

async function unclaimProject(id){
  try{
    const data = await apiPost('unclaim', { projectId: id });
    if (!data.ok) throw new Error(data.error);
    showToast('הפרויקט שוחרר');
    await loadProjects();
  } catch(err){ showToast('לא ניתן לשחרר כרגע'); }
}

function openUpdateModal(p){
  document.getElementById('uProjectId').value = p.ID;
  document.getElementById('uStatus').value = p.Status === 'Done' ? 'Done' : 'In Progress';
  document.getElementById('uNotes').value = p.ProgressNotes || '';
  document.getElementById('updateOverlay').hidden = false;
}

document.getElementById('updateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type=submit]');
  submitBtn.disabled = true; submitBtn.textContent = 'שומר…';
  try{
    const data = await apiPost('updateProgress', {
      projectId: document.getElementById('uProjectId').value,
      status: document.getElementById('uStatus').value,
      notes: document.getElementById('uNotes').value.trim()
    });
    if (!data.ok) throw new Error(data.error);
    document.getElementById('updateOverlay').hidden = true;
    showToast('העדכון נשמר');
    await loadProjects();
  } catch(err){
    showToast('משהו השתבש, נסו שוב');
  } finally {
    submitBtn.disabled = false; submitBtn.textContent = 'שמירה';
  }
});

/* ============ Toast ============ */
let toastTimer;
function showToast(msg){
  clearTimeout(toastTimer);
  let el = document.querySelector('.toast');
  if (!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  toastTimer = setTimeout(() => el.remove(), 3200);
}
</script>
</body>
</html>
