<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח פרויקטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --ink:#1E2330;
    --ink-soft:#6B7280;
    --ink-faint:#9CA3AF;
    --line:#E7E9EE;
    --line-strong:#D8DBE3;
    --accent:#0F766E;
    --accent-soft:#E7F4F2;
    --accent-ink:#0B5A54;
    --amber-ink:#9A5B0C;
    --amber-soft:#FBF0DE;
    --green-ink:#1D6B45;
    --green-soft:#E8F5EE;
    --radius:12px;
    --radius-lg:18px;
    --shadow-sm:0 1px 2px rgba(20,23,31,.05);
    --shadow-md:0 10px 30px -14px rgba(20,23,31,.18);
    --font-display:'Rubik','Assistant',sans-serif;
    --font-body:'Assistant',sans-serif;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  /* ===== Header ===== */
  header.top{
    position:sticky; top:0; z-index:40; background:rgba(247,248,250,.9);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:1080px; margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:700; font-size:1.05rem; }
  .brand-mark{ width:26px; height:26px; border-radius:7px; background:var(--accent); flex:none; }

  .auth-area{ display:flex; align-items:center; gap:12px; min-height:36px; }
  .user-chip{
    display:flex; align-items:center; gap:9px; background:var(--surface);
    border:1px solid var(--line); border-radius:999px; padding:4px 5px 4px 14px; font-size:.86rem;
  }
  .user-chip img{ width:24px; height:24px; border-radius:50%; }
  .btn-logout{ background:none; border:none; color:var(--ink-faint); font-size:.8rem; padding:0; }
  .btn-logout:hover{ color:var(--ink-soft); }

  /* ===== Hero ===== */
  .hero{ max-width:720px; margin:0 auto; padding:64px 24px 8px; text-align:center; }
  .eyebrow{
    font-size:.78rem; font-weight:600; letter-spacing:.04em; color:var(--accent-ink);
    text-transform:uppercase; margin:0 0 14px;
  }
  h1{
    font-family:var(--font-display); font-weight:700; font-size:2.35rem;
    line-height:1.2; margin:0 0 14px; letter-spacing:-.01em;
  }
  @media (max-width:560px){ h1{ font-size:1.85rem; } }
  .hero p{ color:var(--ink-soft); font-size:1.02rem; max-width:46ch; margin:0 auto 28px; }
  .hero-actions{ display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; }
  .btn-primary{
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:12px 22px; font-size:.95rem; font-weight:600; font-family:var(--font-body);
    transition:background .15s ease;
  }
  .btn-primary:hover{ background:var(--accent-ink); }
  .btn-primary:disabled{ background:var(--line-strong); color:#9BA0AC; cursor:not-allowed; }
  .hint-text{ font-size:.86rem; color:var(--ink-faint); }

  .stats-strip{
    max-width:640px; margin:36px auto 0; display:flex; justify-content:center; gap:0;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm); overflow:hidden;
  }
  .stats-strip .stat{ flex:1; padding:18px 12px; text-align:center; border-inline-start:1px solid var(--line); }
  .stats-strip .stat:first-child{ border-inline-start:none; }
  .stats-strip .num{ font-family:var(--font-display); font-weight:700; font-size:1.5rem; display:block; }
  .stats-strip .lbl{ font-size:.78rem; color:var(--ink-soft); margin-top:2px; display:block; }

  /* ===== Filters ===== */
  .filters{
    max-width:1080px; margin:44px auto 0; padding:0 24px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
  }
  .status-tabs{ display:flex; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .status-tabs button{
    border:none; background:none; padding:8px 14px; border-radius:8px; font-size:.85rem;
    color:var(--ink-soft); font-weight:600; transition:background .15s ease, color .15s ease;
  }
  .status-tabs button.active{ background:var(--ink); color:#fff; }
  .filter-right{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select, input[type=text], input[type=search]{
    font-family:inherit; border:1px solid var(--line); background:var(--surface);
    border-radius:9px; padding:8px 12px; font-size:.85rem; color:var(--ink);
  }
  select:focus, input:focus{ border-color:var(--accent); }

  /* ===== Board ===== */
  .board{ max-width:1080px; margin:0 auto; padding:22px 24px 90px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:20px; display:flex; flex-direction:column; gap:12px;
    transition:box-shadow .15s ease, border-color .15s ease;
    animation:fadein .3s ease both;
  }
  .card:hover{ box-shadow:var(--shadow-md); border-color:var(--line-strong); }
  @keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }

  .card-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .pill{
    font-size:.72rem; font-weight:600; border-radius:999px; padding:4px 10px; white-space:nowrap;
  }
  .pill-open{ color:var(--accent-ink); background:var(--accent-soft); }
  .pill-progress{ color:var(--amber-ink); background:var(--amber-soft); }
  .pill-done{ color:var(--green-ink); background:var(--green-soft); }
  .difficulty{ font-size:.76rem; color:var(--ink-faint); font-weight:500; }

  .card h3{ font-family:var(--font-display); font-size:1.06rem; font-weight:600; margin:0; line-height:1.35; }
  .card .desc{
    color:var(--ink-soft); font-size:.88rem; margin:0;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-size:.72rem; color:var(--ink-soft); background:var(--bg); border:1px solid var(--line);
    border-radius:6px; padding:3px 8px;
  }
  .card .meta{ font-size:.76rem; color:var(--ink-faint); margin-top:auto; padding-top:2px; }
  .card .meta strong{ color:var(--ink-soft); font-weight:600; }

  .btn-detail{
    border:1px solid var(--line-strong); background:none; color:var(--ink);
    border-radius:9px; padding:9px 12px; font-size:.85rem; font-weight:600; width:100%;
    transition:background .15s ease;
  }
  .btn-detail:hover{ background:var(--bg); }

  .empty{
    text-align:center; padding:80px 20px; color:var(--ink-soft);
    border:1px dashed var(--line-strong); border-radius:var(--radius-lg); background:var(--surface);
  }
  .empty strong{ display:block; color:var(--ink); font-family:var(--font-display); font-size:1.08rem; margin-bottom:6px; }
  .loading{ text-align:center; padding:70px 0; color:var(--ink-faint); font-size:.88rem; }

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(20,23,31,.4);
    display:flex; align-items:flex-start; justify-content:center; padding:5vh 20px; z-index:100;
    overflow-y:auto;
  }
  .overlay[hidden]{ display:none; }
  .modal{
    background:var(--surface); border-radius:var(--radius-lg); padding:28px; width:100%; max-width:480px;
    box-shadow:var(--shadow-md); animation:pop .16s ease both; margin:auto 0;
  }
  .modal.wide{ max-width:600px; }
  @keyframes pop{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  .modal-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:6px; }
  .modal h2{ font-family:var(--font-display); font-size:1.2rem; font-weight:600; margin:0 0 4px; }
  .btn-x{ background:none; border:none; color:var(--ink-faint); font-size:1.3rem; line-height:1; padding:2px 4px; }
  .btn-x:hover{ color:var(--ink); }

  .field{ margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field label{ font-size:.8rem; font-weight:600; color:var(--ink-soft); }
  .field .optional{ font-weight:400; color:var(--ink-faint); }
  .field input, .field textarea, .field select{
    font-family:inherit; border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-size:.9rem; width:100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--accent); }
  .field textarea{ min-height:88px; resize:vertical; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn-ghost{ background:none; border:1px solid var(--line-strong); border-radius:9px; padding:11px 16px; font-weight:600; flex:1; color:var(--ink); }
  .btn-ghost:hover{ background:var(--bg); }
  .btn-danger{ color:#B42318; border-color:#F3D0CB; }
  .btn-danger:hover{ background:#FEF3F2; }

  /* Detail modal specifics */
  .detail-tags{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px; }
  .detail-desc{ font-size:.92rem; color:var(--ink-soft); white-space:pre-wrap; margin:0 0 16px; }
  .detail-link{
    display:inline-flex; align-items:center; gap:4px; font-size:.85rem; color:var(--accent-ink);
    font-weight:600; margin-bottom:16px; text-decoration:none; border-bottom:1px solid transparent;
  }
  .detail-link:hover{ border-color:var(--accent-ink); }
  .detail-meta-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;
    padding:14px; background:var(--bg); border-radius:10px;
  }
  .detail-meta-grid div{ display:flex; align-items:center; gap:8px; font-size:.83rem; }
  .detail-meta-grid img{ width:22px; height:22px; border-radius:50%; }
  .detail-meta-grid .label{ display:block; font-size:.7rem; color:var(--ink-faint); }

  .timeline{ margin:0 0 18px; padding:0; list-style:none; display:flex; flex-direction:column; gap:0; }
  .timeline li{ position:relative; padding:0 0 16px 0; padding-inline-start:20px; border-inline-start:1.5px solid var(--line); }
  .timeline li:last-child{ border-color:transparent; padding-bottom:0; }
  .timeline li::before{
    content:''; position:absolute; inset-inline-start:-5.5px; top:2px;
    width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--surface);
  }
  .timeline .t-head{ font-size:.82rem; font-weight:600; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .timeline .t-date{ font-size:.72rem; color:var(--ink-faint); font-weight:400; }
  .timeline .t-note{ font-size:.83rem; color:var(--ink-soft); margin-top:2px; }

  .section-title{ font-size:.78rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin:0 0 10px; }
  .action-panel{ border-top:1px solid var(--line); margin-top:6px; padding-top:18px; }
  .readonly-note{ font-size:.85rem; color:var(--ink-faint); background:var(--bg); border-radius:9px; padding:12px 14px; }

  /* ===== Toast ===== */
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff;
    padding:12px 18px; border-radius:10px; font-size:.86rem; box-shadow:var(--shadow-md);
    z-index:200; animation:pop .16s ease both;
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="brand-mark"></span> לוח פרויקטים</div>
    <div class="auth-area" id="authArea"><div id="gsiButton"></div></div>
  </div>
</header>

<section class="hero">
  <p class="eyebrow">לוח פרויקטים קהילתי</p>
  <h1>מהרעיון שלך<br>לפרויקט חי</h1>
  <p>מפרסמים רעיון לאתר, אפליקציה או תוכנת מחשב, ומישהו אחר לוקח אותו על עצמו ומעדכן איך זה מתקדם.</p>
  <div class="hero-actions">
    <button class="btn-primary" id="openCreateBtn" disabled>פרסום רעיון חדש</button>
    <span class="hint-text" id="loginHint">התחברו עם גוגל כדי להשתתף</span>
  </div>

  <div class="stats-strip" id="statsStrip" aria-hidden="true">
    <div class="stat"><span class="num" id="statOpen">–</span><span class="lbl">פתוחים</span></div>
    <div class="stat"><span class="num" id="statProgress">–</span><span class="lbl">בבנייה</span></div>
    <div class="stat"><span class="num" id="statDone">–</span><span class="lbl">הושלמו</span></div>
  </div>
</section>

<div class="filters">
  <div class="status-tabs" id="statusTabs">
    <button data-status="all" class="active">הכל</button>
    <button data-status="Open">פתוח</button>
    <button data-status="In Progress">בבנייה</button>
    <button data-status="Done">הושלם</button>
  </div>
  <div class="filter-right">
    <select id="typeFilter" aria-label="סינון לפי סוג">
      <option value="all">כל הסוגים</option>
      <option value="אתר">אתר</option>
      <option value="אפליקציה">אפליקציה</option>
      <option value="תוכנת מחשב">תוכנת מחשב</option>
    </select>
    <select id="difficultyFilter" aria-label="סינון לפי רמת קושי">
      <option value="all">כל הרמות</option>
      <option value="קל">קל</option>
      <option value="בינוני">בינוני</option>
      <option value="מאתגר">מאתגר</option>
    </select>
    <select id="sortSelect" aria-label="מיון">
      <option value="newest">חדש קודם</option>
      <option value="oldest">ישן קודם</option>
      <option value="alpha">לפי שם</option>
    </select>
    <input type="search" id="searchInput" placeholder="חיפוש…" aria-label="חיפוש פרויקטים">
  </div>
</div>

<main class="board">
  <div id="boardContent" class="loading">טוען פרויקטים…</div>
</main>

<!-- Create / Edit modal -->
<div class="overlay" id="createOverlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 id="createModalTitle">פרויקט חדש</h2>
      <button class="btn-x" data-close="createOverlay" aria-label="סגירה">&times;</button>
    </div>
    <form id="createForm">
      <input type="hidden" id="editingId">
      <div class="field">
        <label for="cTitle">שם הפרויקט</label>
        <input type="text" id="cTitle" required maxlength="80">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="cType">סוג</label>
          <select id="cType">
            <option value="אתר">אתר</option>
            <option value="אפליקציה">אפליקציה</option>
            <option value="תוכנת מחשב">תוכנת מחשב</option>
          </select>
        </div>
        <div class="field">
          <label for="cDifficulty">רמת קושי</label>
          <select id="cDifficulty">
            <option value="קל">קל</option>
            <option value="בינוני">בינוני</option>
            <option value="מאתגר">מאתגר</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="cDesc">מה בדיוק רוצים שיקרה?</label>
        <textarea id="cDesc" required maxlength="800" placeholder="תארו את הרעיון, מה הוא פותר, ולמי הוא מיועד"></textarea>
      </div>
      <div class="field">
        <label for="cTags">תגיות / כישורים נדרשים <span class="optional">(אופציונלי, מופרד בפסיקים)</span></label>
        <input type="text" id="cTags" placeholder="React, עיצוב UI, Python">
      </div>
      <div class="field">
        <label for="cLink">קישור להשראה / מקור <span class="optional">(אופציונלי)</span></label>
        <input type="url" id="cLink" placeholder="https://…">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-close="createOverlay">ביטול</button>
        <button type="submit" class="btn-primary" style="flex:1" id="createSubmitBtn">פרסום</button>
      </div>
    </form>
  </div>
</div>

<!-- Detail modal -->
<div class="overlay" id="detailOverlay" hidden>
  <div class="modal wide" id="detailModalBody"></div>
</div>

<script>
/* ============ הגדרות צד לקוח בלבד ============ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby1aW_Hi1suSVQmBfU9sp9jQ80xXiFSImLBnLhElP4LmUjF7mOhi0HizeOnz63GCEXg/exec';
const GOOGLE_CLIENT_ID = '176938351727-t5cgglugm7cgf2j5b2g512jn2ol5agic.apps.googleusercontent.com';

/* ============ מצב ============ */
let currentUser = null;
let allProjects = [];
let statusFilter = 'all', typeFilter = 'all', difficultyFilter = 'all', sortMode = 'newest', searchTerm = '';

const STATUS_LABEL = { 'Open':'פתוח', 'In Progress':'בבנייה', 'Done':'הושלם' };
const STATUS_PILL = { 'Open':'pill-open', 'In Progress':'pill-progress', 'Done':'pill-done' };

/* ============ Google Sign-In ============ */
function decodeJwt(token){
  const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  const json = decodeURIComponent(atob(base64).split('').map(c =>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(json);
}
function handleCredentialResponse(response){
  const payload = decodeJwt(response.credential);
  currentUser = { email: payload.email, name: payload.name, picture: payload.picture };
  renderAuthArea();
  renderBoard();
}
function renderAuthArea(){
  const openBtn = document.getElementById('openCreateBtn');
  const hint = document.getElementById('loginHint');
  const area = document.getElementById('authArea');
  if (currentUser){
    openBtn.disabled = false;
    hint.style.display = 'none';
    area.innerHTML = `<div class="user-chip"><img src="${currentUser.picture}" alt=""><span>${escapeHtml(currentUser.name)}</span><button class="btn-logout" id="logoutBtn">יציאה</button></div>`;
    document.getElementById('logoutBtn').addEventListener('click', logout);
  } else {
    openBtn.disabled = true;
    hint.style.display = '';
    area.innerHTML = `<div id="gsiButton"></div>`;
    renderGsiButton();
  }
}
function logout(){
  currentUser = null;
  google.accounts.id.disableAutoSelect();
  renderAuthArea();
  renderBoard();
}
function renderGsiButton(){
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
  google.accounts.id.renderButton(document.getElementById('gsiButton'),
    { theme:'outline', size:'medium', shape:'pill', text:'signin', locale:'iw' });
}
window.addEventListener('load', () => { renderGsiButton(); loadProjects(); });

/* ============ API ============ */
async function apiGet(action){
  const res = await fetch(`${SCRIPT_URL}?action=${encodeURIComponent(action)}`);
  return res.json();
}
async function apiPost(action, payload){
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action, email: currentUser.email, name: currentUser.name, ...payload })
  });
  return res.json();
}
async function loadProjects(){
  const board = document.getElementById('boardContent');
  board.className = 'loading';
  board.textContent = 'טוען פרויקטים…';
  try{
    const data = await apiGet('list');
    if (!data.ok) throw new Error(data.error || 'שגיאה');
    allProjects = data.projects;
    renderStats();
    renderBoard();
  } catch(err){
    board.className = 'empty';
    board.innerHTML = `<strong>לא הצלחנו לטעון את הלוח</strong>יש לוודא שהסקריפט פרוס כ"Anyone can access".<br><button class="btn-ghost" style="margin-top:14px; display:inline-block; width:auto" onclick="loadProjects()">נסו שוב</button>`;
  }
}

/* ============ עזרי תצוגה ============ */
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function formatDate(iso){
  try{
    return new Date(iso).toLocaleDateString('he-IL', { day:'numeric', month:'short', year:'numeric' });
  } catch(e){ return ''; }
}
function tagsArray(tagsStr){
  return (tagsStr||'').split(',').map(t => t.trim()).filter(Boolean);
}

function renderStats(){
  const counts = { Open:0, 'In Progress':0, Done:0 };
  allProjects.forEach(p => { if (counts[p.Status] !== undefined) counts[p.Status]++; });
  document.getElementById('statOpen').textContent = counts.Open;
  document.getElementById('statProgress').textContent = counts['In Progress'];
  document.getElementById('statDone').textContent = counts.Done;
}

function getFilteredSorted(){
  let list = allProjects.filter(p => {
    if (statusFilter !== 'all' && p.Status !== statusFilter) return false;
    if (typeFilter !== 'all' && p.Type !== typeFilter) return false;
    if (difficultyFilter !== 'all' && p.Difficulty !== difficultyFilter) return false;
    if (searchTerm){
      const hay = (p.Title + ' ' + p.Description + ' ' + (p.Tags||'')).toLowerCase();
      if (!hay.includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  });
  if (sortMode === 'newest') list.sort((a,b) => new Date(b.CreatedAt) - new Date(a.CreatedAt));
  else if (sortMode === 'oldest') list.sort((a,b) => new Date(a.CreatedAt) - new Date(b.CreatedAt));
  else if (sortMode === 'alpha') list.sort((a,b) => a.Title.localeCompare(b.Title, 'he'));
  return list;
}

function renderBoard(){
  const board = document.getElementById('boardContent');
  const list = getFilteredSorted();
  if (list.length === 0){
    board.className = 'empty';
    board.innerHTML = `<strong>אין עדיין פרויקטים כאלה</strong>זה מקום טוב להיות הראשונים לפרסם רעיון.`;
    return;
  }
  board.className = 'grid';
  board.innerHTML = list.map(cardHtml).join('');
  list.forEach(p => {
    document.getElementById('open-' + p.ID).addEventListener('click', () => openDetail(p.ID));
  });
}

function cardHtml(p){
  const tags = tagsArray(p.Tags).slice(0, 3);
  return `
    <article class="card">
      <div class="card-top">
        <span class="pill ${STATUS_PILL[p.Status] || 'pill-open'}">${STATUS_LABEL[p.Status] || p.Status}</span>
        <span class="difficulty">${escapeHtml(p.Difficulty || '')}</span>
      </div>
      <h3>${escapeHtml(p.Title)}</h3>
      <p class="desc">${escapeHtml(p.Description)}</p>
      ${tags.length ? `<div class="chip-row">${tags.map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <div class="meta">מאת <strong>${escapeHtml(p.CreatorName)}</strong> · ${formatDate(p.CreatedAt)}</div>
      <button class="btn-detail" id="open-${p.ID}">לפרטים</button>
    </article>`;
}

/* ============ פילטרים ============ */
document.getElementById('statusTabs').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  document.querySelectorAll('#statusTabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  statusFilter = btn.dataset.status;
  renderBoard();
});
document.getElementById('typeFilter').addEventListener('change', e => { typeFilter = e.target.value; renderBoard(); });
document.getElementById('difficultyFilter').addEventListener('change', e => { difficultyFilter = e.target.value; renderBoard(); });
document.getElementById('sortSelect').addEventListener('change', e => { sortMode = e.target.value; renderBoard(); });
document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value; renderBoard(); });

/* ============ יצירה / עריכה ============ */
document.getElementById('openCreateBtn').addEventListener('click', () => {
  if (!currentUser) return;
  document.getElementById('editingId').value = '';
  document.getElementById('createModalTitle').textContent = 'פרויקט חדש';
  document.getElementById('createSubmitBtn').textContent = 'פרסום';
  document.getElementById('createForm').reset();
  document.getElementById('createOverlay').hidden = false;
});
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => { document.getElementById(btn.dataset.close).hidden = true; });
});
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov) ov.hidden = true; });
});

document.getElementById('createForm').addEventListener('submit', async e => {
  e.preventDefault();
  const submitBtn = document.getElementById('createSubmitBtn');
  const editingId = document.getElementById('editingId').value;
  submitBtn.disabled = true; submitBtn.textContent = editingId ? 'שומר…' : 'מפרסם…';
  const fields = {
    title: document.getElementById('cTitle').value.trim(),
    type: document.getElementById('cType').value,
    difficulty: document.getElementById('cDifficulty').value,
    description: document.getElementById('cDesc').value.trim(),
    tags: document.getElementById('cTags').value.trim(),
    link: document.getElementById('cLink').value.trim()
  };
  try{
    const data = editingId
      ? await apiPost('edit', { projectId: editingId, ...fields })
      : await apiPost('create', fields);
    if (!data.ok) throw new Error(data.error);
    document.getElementById('createOverlay').hidden = true;
    e.target.reset();
    showToast(editingId ? 'הפרויקט עודכן' : 'הרעיון פורסם!');
    await loadProjects();
  } catch(err){
    showToast('משהו השתבש, נסו שוב');
  } finally {
    submitBtn.disabled = false; submitBtn.textContent = editingId ? 'שמירה' : 'פרסום';
  }
});

function openEditModal(p){
  document.getElementById('editingId').value = p.ID;
  document.getElementById('createModalTitle').textContent = 'עריכת פרויקט';
  document.getElementById('createSubmitBtn').textContent = 'שמירה';
  document.getElementById('cTitle').value = p.Title;
  document.getElementById('cType').value = p.Type;
  document.getElementById('cDifficulty').value = p.Difficulty;
  document.getElementById('cDesc').value = p.Description;
  document.getElementById('cTags').value = p.Tags;
  document.getElementById('cLink').value = p.Link;
  document.getElementById('detailOverlay').hidden = true;
  document.getElementById('createOverlay').hidden = false;
}

/* ============ מודל פרטים ============ */
function openDetail(id){
  const p = allProjects.find(x => x.ID === id);
  if (!p) return;
  document.getElementById('detailModalBody').innerHTML = detailHtml(p);
  document.getElementById('detailOverlay').hidden = false;
  wireDetailActions(p);
}

function detailHtml(p){
  const tags = tagsArray(p.Tags);
  const log = (p.UpdatesLog || []).slice().reverse();
  const isCreator = currentUser && p.CreatorEmail === currentUser.email;
  const isClaimer = currentUser && p.ClaimedByEmail === currentUser.email;
  const isOpen = p.Status === 'Open';

  let actionPanel;
  if (!currentUser){
    actionPanel = `<p class="readonly-note">התחברו עם גוגל כדי לקחת פרויקט או לעדכן התקדמות.</p>`;
  } else if (isOpen && !isCreator){
    actionPanel = `<button class="btn-primary" style="width:100%" id="detailClaimBtn">לקחת על עצמי את הפרויקט</button>`;
  } else if (isOpen && isCreator){
    actionPanel = `
      <div style="display:flex; gap:10px">
        <button class="btn-ghost" id="detailEditBtn">עריכה</button>
        <button class="btn-ghost btn-danger" id="detailDeleteBtn">מחיקה</button>
      </div>`;
  } else if (isClaimer){
    actionPanel = `
      <div class="field">
        <label for="uStatus">סטטוס</label>
        <select id="uStatus">
          <option value="In Progress" ${p.Status==='In Progress'?'selected':''}>בבנייה</option>
          <option value="Done" ${p.Status==='Done'?'selected':''}>הושלם</option>
        </select>
      </div>
      <div class="field">
        <label for="uNotes">מה קרה מאז העדכון האחרון?</label>
        <textarea id="uNotes" maxlength="600" placeholder="עדכון קצר על ההתקדמות"></textarea>
      </div>
      <div style="display:flex; gap:10px">
        <button class="btn-ghost" id="detailUnclaimBtn">שחרור הפרויקט</button>
        <button class="btn-primary" style="flex:1" id="detailUpdateBtn">שמירת עדכון</button>
      </div>`;
  } else {
    actionPanel = `<p class="readonly-note">הפרויקט בטיפולו/ה של ${escapeHtml(p.ClaimedByName)}.</p>`;
  }

  return `
    <div class="modal-head">
      <div>
        <span class="pill ${STATUS_PILL[p.Status] || 'pill-open'}">${STATUS_LABEL[p.Status] || p.Status}</span>
      </div>
      <button class="btn-x" data-close="detailOverlay" aria-label="סגירה">&times;</button>
    </div>
    <h2>${escapeHtml(p.Title)}</h2>
    <div class="detail-tags">
      <span class="chip">${escapeHtml(p.Type)}</span>
      <span class="chip">${escapeHtml(p.Difficulty)}</span>
      ${tags.map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}
    </div>
    <p class="detail-desc">${escapeHtml(p.Description)}</p>
    ${p.Link ? `<a class="detail-link" href="${escapeHtml(p.Link)}" target="_blank" rel="noopener">מקור / השראה ↗</a>` : ''}

    <div class="detail-meta-grid">
      <div><span><span class="label">פורסם ע"י</span><strong>${escapeHtml(p.CreatorName)}</strong></span></div>
      <div><span><span class="label">בטיפול</span><strong>${p.ClaimedByName ? escapeHtml(p.ClaimedByName) : '—'}</strong></span></div>
    </div>

    <p class="section-title">היסטוריית עדכונים</p>
    <ul class="timeline">
      ${log.map(entry => `
        <li>
          <div class="t-head">${escapeHtml(entry.author)} <span class="t-date">${formatDate(entry.date)}</span></div>
          ${entry.note ? `<div class="t-note">${escapeHtml(entry.note)}</div>` : ''}
        </li>`).join('')}
    </ul>

    <div class="action-panel">${actionPanel}</div>
  `;
}

function wireDetailActions(p){
  const claimBtn = document.getElementById('detailClaimBtn');
  if (claimBtn) claimBtn.addEventListener('click', () => claimProject(p.ID));
  const unclaimBtn = document.getElementById('detailUnclaimBtn');
  if (unclaimBtn) unclaimBtn.addEventListener('click', () => unclaimProject(p.ID));
  const updateBtn = document.getElementById('detailUpdateBtn');
  if (updateBtn) updateBtn.addEventListener('click', () => submitUpdate(p.ID));
  const editBtn = document.getElementById('detailEditBtn');
  if (editBtn) editBtn.addEventListener('click', () => openEditModal(p));
  const deleteBtn = document.getElementById('detailDeleteBtn');
  if (deleteBtn) deleteBtn.addEventListener('click', () => deleteProject(p.ID));
}

async function claimProject(id){
  try{
    const data = await apiPost('claim', { projectId: id });
    if (!data.ok) throw new Error(data.error);
    showToast('הפרויקט אצלכם — בהצלחה בבנייה!');
    document.getElementById('detailOverlay').hidden = true;
    await loadProjects();
  } catch(err){ showToast('לא ניתן לקחת את הפרויקט כרגע'); }
}
async function unclaimProject(id){
  try{
    const data = await apiPost('unclaim', { projectId: id });
    if (!data.ok) throw new Error(data.error);
    showToast('הפרויקט שוחרר');
    document.getElementById('detailOverlay').hidden = true;
    await loadProjects();
  } catch(err){ showToast('לא ניתן לשחרר כרגע'); }
}
async function submitUpdate(id){
  const btn = document.getElementById('detailUpdateBtn');
  btn.disabled = true; btn.textContent = 'שומר…';
  try{
    const data = await apiPost('updateProgress', {
      projectId: id,
      status: document.getElementById('uStatus').value,
      notes: document.getElementById('uNotes').value.trim()
    });
    if (!data.ok) throw new Error(data.error);
    showToast('העדכון נשמר');
    document.getElementById('detailOverlay').hidden = true;
    await loadProjects();
  } catch(err){
    showToast('משהו השתבש, נסו שוב');
    btn.disabled = false; btn.textContent = 'שמירת עדכון';
  }
}
async function deleteProject(id){
  if (!confirm('למחוק את הפרויקט לצמיתות?')) return;
  try{
    const data = await apiPost('delete', { projectId: id });
    if (!data.ok) throw new Error(data.error);
    showToast('הפרויקט נמחק');
    document.getElementById('detailOverlay').hidden = true;
    await loadProjects();
  } catch(err){ showToast('לא ניתן למחוק כרגע'); }
}

/* ============ Toast ============ */
let toastTimer;
function showToast(msg){
  clearTimeout(toastTimer);
  let el = document.querySelector('.toast');
  if (!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  toastTimer = setTimeout(() => el.remove(), 3200);
}
</script>
